services:
  # PHP-FPM Application Server
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: jurnal-kelas-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - jurnal-kelas-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Nginx Web Server (Alpine)
  nginx:
    image: nginx:stable-alpine
    container_name: jurnal-kelas-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - jurnal-kelas-network
    depends_on:
      - app

  # MySQL 8 Database (no official Alpine image available)
  mysql:
    image: mysql:8.0
    container_name: jurnal-kelas-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-jurnal_kelas}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - jurnal-kelas-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue (Alpine)
  redis:
    image: redis:7-alpine
    container_name: jurnal-kelas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - jurnal-kelas-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Bun for Vite + Bootstrap asset compilation
  bun:
    image: oven/bun:alpine
    container_name: jurnal-kelas-bun
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - jurnal-kelas-network
    # Keeps the container running for `docker compose exec bun` usage
    command: sh -c "bun install && bun run dev"
    profiles:
      - dev

  # Mailpit for local email testing
  mailpit:
    image: axllent/mailpit:latest
    container_name: jurnal-kelas-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    networks:
      - jurnal-kelas-network

  # phpMyAdmin for database management (Alpine)
  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: jurnal-kelas-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    networks:
      - jurnal-kelas-network
    depends_on:
      mysql:
        condition: service_healthy
    profiles:
      - dev

networks:
  jurnal-kelas-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
