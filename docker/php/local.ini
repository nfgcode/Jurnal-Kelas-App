; PHP configuration overrides for Laravel development

upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
memory_limit = 512M

; OPcache settings (improves performance significantly)
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
; Re-stat cached files at most once per 60s. With revalidate_freq = 0 every
; request stat()s every PHP file, which over the Windows bind mount costs ~10s
; per request. Trade-off: an edited file can take up to 60s to be picked up.
opcache.revalidate_freq = 60

; Cache resolved file paths (separate from opcache) — same bind-mount tax.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Error display (development)
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Session
session.save_handler = redis
session.save_path = "tcp://redis:6379"
